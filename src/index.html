<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />

    <title>Aditya Jha — Android ROM porter, kernel dev, web builder</title>
    <meta
      name="description"
      content="Portfolio of Aditya Jha (@ozyern) — maintainer of BrinaOS Ports, founder of the ReVork community, and builder of liquid-glass web experiences."
    />
    <meta name="author" content="Aditya Jha" />
    <link rel="canonical" href="https://about.ozyern.me/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aditya Jha — @ozyern" />

      property="og:description"
      content="Android ROM porter, kernel dev and web builder. BrinaOS Ports, ReVork, Exhale."

    <link rel="icon" type="image/png" href="./assets/favicon.png" />

    <!--
      One font request, with exactly the weights the stylesheet asks for. This
      used to be duplicated by an @import inside index.css with a different set
      of weights, which meant two blocking round trips and a wasted download.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap"
    />

    <!-- The hero portrait is the largest element on first paint. -->
    <link rel="preload" as="image" href="./assets/hero-photo.jpg" fetchpriority="high" />

    <script type="module" src="./main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
